/* --------------------------------------------------------------------------
   2. AVAILABLE SECTION - the divider, heading and intro above the open slots.
      {count} is replaced with the live number of available players, so the
      sentence never goes stale as slots are signed. The whole section hides
      itself when no players are marked available.

      AVAILABLE_CONTACTS takes as many people as you like. Each one gets its
      own line under the intro sentence, name then address, so long email
      addresses never break the paragraph rag. Empty the array and both the
      list and the "get in touch" lead disappear.
   -------------------------------------------------------------------------- */
var AVAILABLE_HEADING   = "Available for NBL27";
var AVAILABLE_INTRO_ONE = "{count} player is still open for partnership.";
var AVAILABLE_INTRO_MANY= "{count} players are still open for partnership.";
var AVAILABLE_LINK      = "https://hawks-corporate-hospitality.lovable.app/";
var AVAILABLE_LINK_TEXT = "See what a partnership includes";
var AVAILABLE_CONTACT_LEAD = "or get in touch:";

  { name: "Craig Browne", email: "craig.browne@hawks.com.au" },
  { name: "Kent Robson", email: "kent.robson@hawks.com.au" }

/* Screen reader label for the first grid, which has no visible heading. */

/* --------------------------------------------------------------------------

var SHOW_FOOTER   = false;

<style>
  .hpp { max-width: 870px; margin: 0 auto; background: #FFFFFF; box-sizing: border-box;
         font-family: Poppins, Arial, 'Helvetica Neue', Helvetica, sans-serif; }
  .hpp * { box-sizing: border-box; }
  .hpp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 32px 24px; align-items: start; }
  .hpp-card { display: flex; flex-direction: column; background: #FFFFFF; }
  .hpp-tile { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #FFFFFF; border: 1px solid #E2E2E2; overflow: hidden; }
  .hpp-player { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hpp-body { padding: 14px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .hpp-name { font-family: Anton, Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 400;
              text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; font-size: 24px; color: #000000; margin: 0; }
  .hpp-sponsor { font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
                 color: #FF0013; text-decoration: none; align-self: flex-start; transition: color 120ms cubic-bezier(0.22,1,0.36,1); }
  a.hpp-sponsor:hover { color: #BF0000; text-decoration: underline; }
  a.hpp-sponsor:focus-visible { outline: 2px solid #FF0013; outline-offset: 2px; }
  .hpp-blurb { margin: 2px 0 0; font-size: 14px; line-height: 1.5; color: #373737; text-wrap: pretty; }
  .hpp-section { margin-top: 48px; border-top: 1px solid #E2E2E2; padding-top: 24px; }
  .hpp-section-head { margin-bottom: 24px; }
  .hpp-section-title { font-family: Anton, Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 400;
                       text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; font-size: 24px;
                       color: #000000; margin: 0 0 8px; }
  .hpp-section-intro { margin: 0; font-size: 14px; line-height: 1.5; color: #373737; max-width: 560px; text-wrap: balance; }
  .hpp-contacts { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .hpp-contacts li { font-size: 14px; line-height: 1.5; color: #373737; }
  .hpp-contact-name { font-weight: 600; color: #000000; }
  .hpp-link { color: #FF0013; text-decoration: none; font-weight: 600; transition: color 120ms cubic-bezier(0.22,1,0.36,1); }
  .hpp-link:hover { color: #BF0000; text-decoration: underline; }
  .hpp-link:focus-visible { outline: 2px solid #FF0013; outline-offset: 2px; }
  .hpp-footer { margin-top: 48px; border-top: 1px solid #E2E2E2; padding-top: 24px; }
  .hpp-footer p { margin: 0; font-size: 14px; line-height: 1.5; color: #373737; max-width: 560px; text-wrap: balance; }
  @media (prefers-reduced-motion: reduce) {
    .hpp-sponsor, .hpp-link { transition: none; }
  }
</style>

<div id="hpp-root" class="hpp"></div>

<script>
(function () {
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  /* Surname used for sorting. Explicit field wins. Fallback strips any
     nickname in quotes and takes the last word of the name. */
  var surnameOf = function (p) {
    if (p.surname) { return String(p.surname); }
    var parts = String(p.name || "").replace(/'[^']*'/g, " ").trim().split(/\s+/);
    return parts.length ? parts[parts.length - 1] : "";
  };

  var bySurname = function (a, b) {
    var r = surnameOf(a).localeCompare(surnameOf(b), "en-AU", { sensitivity: "base" });
    if (r !== 0) { return r; }
    return String(a.name || "").localeCompare(String(b.name || ""), "en-AU", { sensitivity: "base" });
  };

  var all = Array.isArray(PLAYERS) ? PLAYERS.slice() : [];
  var partnered = all.filter(function (p) { return !p.available; }).sort(bySurname);
  var available = all.filter(function (p) { return !!p.available; }).sort(bySurname);

  /* Builds one line per contact, name then linked address. Keeping the long
     addresses out of the running sentence stops them forcing bad line breaks.
     Returns "" when no usable contacts are set. */
  var contactsHtml = function () {
    var list = (typeof AVAILABLE_CONTACTS !== "undefined" && Array.isArray(AVAILABLE_CONTACTS))
      ? AVAILABLE_CONTACTS : [];
    var rows = "";
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (!c || !c.email) { continue; }
      rows += '<li>' +
              (c.name ? '<span class="hpp-contact-name">' + esc(c.name) + '</span>, ' : '') +
              '<a class="hpp-link" href="mailto:' + esc(c.email) +
              '?subject=Player%20Partnerships">' + esc(c.email) + '</a>' +
              '</li>';
    }
    return rows ? '<ul class="hpp-contacts">' + rows + '</ul>' : "";
  };

  var card = function (p) {
    var alt = esc(p.name) + (p.sponsor ? " - partner " + esc(p.sponsor) : "");
    var h = '<div class="hpp-card" role="listitem">';
    h +=   '<div class="hpp-tile">';
    h +=     '<img class="hpp-player" src="' + esc(p.image) + '" alt="' + alt + '" loading="lazy">';
    h +=   '</div>';
    h +=   '<div class="hpp-body">';
    h +=     '<p class="hpp-name">' + esc(p.name) + '</p>';
    if (p.sponsor) {
      h += p.url
        ? '<a class="hpp-sponsor" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + esc(p.sponsor) + '</a>'
        : '<span class="hpp-sponsor">' + esc(p.sponsor) + '</span>';
    }
    if (p.sentence) { h += '<p class="hpp-blurb">' + esc(p.sentence) + '</p>'; }
    h +=   '</div>';
    h += '</div>';
    return h;
  };

  var grid = function (list, label) {
    var h = '<div class="hpp-grid" role="list"' + (label ? ' aria-label="' + esc(label) + '"' : '') +
            ' style="grid-template-columns:repeat(auto-fill,minmax(' + MIN_CARD + 'px,1fr))">';
    for (var i = 0; i < list.length; i++) { h += card(list[i]); }
    return h + '</div>';
  };

  var html = "";
  if (partnered.length) { html += grid(partnered, PARTNERED_LABEL); }

  if (available.length) {
    var lead = (available.length === 1 ? AVAILABLE_INTRO_ONE : AVAILABLE_INTRO_MANY)
                 .replace("{count}", String(available.length));
    var contacts = contactsHtml();
    html += '<section class="hpp-section" aria-labelledby="hpp-available-heading">';
    html +=   '<div class="hpp-section-head">';
    html +=     '<h2 class="hpp-section-title" id="hpp-available-heading">' + esc(AVAILABLE_HEADING) + '</h2>';
    html +=     '<p class="hpp-section-intro">' + esc(lead) + ' ' +
                  '<a class="hpp-link" href="' + esc(AVAILABLE_LINK) + '" target="_blank" rel="noopener noreferrer">' +
                    esc(AVAILABLE_LINK_TEXT) + '</a>' +
                  (contacts ? ', ' + esc(AVAILABLE_CONTACT_LEAD) : '.') +
                '</p>';
    html +=     contacts;
    html +=   '</div>';
    html +=   grid(available, AVAILABLE_HEADING);
    html += '</section>';
  }

  if (typeof SHOW_FOOTER !== "undefined" && SHOW_FOOTER) {
    html += '<div class="hpp-footer"><p>' + esc(FOOTER_TEXT) + '</p></div>';
  }

  var root = document.getElementById("hpp-root");
  root.style.maxWidth = MAX_WIDTH + "px";
  root.innerHTML = html;
})();
</script>
