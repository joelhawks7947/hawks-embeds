<!-- ============================================================
     ILLAWARRA HAWKS - CTA BLOCK (DARK)
     Drop into a Webflow Embed element. Self-contained.
     All classes prefixed .hkscta- to avoid collisions.
     All rules scoped under .hkscta to outrank Webflow base CSS.
     Add class "hkscta--light" to the <section> for the
     white background version.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
.hkscta{
  --hkscta-red:#FF0013;
  --hkscta-dark-red:#BF0000;
  --hkscta-black:#000000;
  --hkscta-white:#FFFFFF;
  box-sizing:border-box;
  background:var(--hkscta-black);
  color:var(--hkscta-white);
  padding:48px 32px;
  margin:0;
  border-top:6px solid var(--hkscta-red);
  text-align:center;
  font-family:'Poppins',Arial,Helvetica,sans-serif;
}
.hkscta *,
.hkscta *::before,
.hkscta *::after{box-sizing:border-box;}
.hkscta .hkscta__inner{
  max-width:640px;
  margin:0 auto;
}
.hkscta .hkscta__overline{
  font-family:'Poppins',Arial,sans-serif;
  font-weight:700;
  font-size:12px;
  line-height:1.3;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--hkscta-red);
  margin:0 0 12px;
}
.hkscta .hkscta__heading{
  font-family:'Anton',Impact,sans-serif;
  font-weight:400;
  text-transform:uppercase;
  line-height:0.95;
  letter-spacing:0.01em;
  font-size:clamp(28px,4.5vw,40px);
  color:var(--hkscta-white);
  margin:0 0 14px;
}
.hkscta .hkscta__body{
  font-size:16px;
  line-height:1.55;
  color:#D8D8D8;
  margin:0 0 28px;
}
.hkscta .hkscta__buttons{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}
/* ---- Primary button ---- */
.hkscta .hkscta__button{
  display:inline-block;
  background:var(--hkscta-red);
  color:var(--hkscta-white);
  font-family:'Poppins',Arial,sans-serif;
  font-weight:700;
  font-size:17px;
  line-height:1.2;
  letter-spacing:0.04em;
  text-transform:uppercase;
  text-decoration:none;
  padding:18px 32px;
  border:2px solid var(--hkscta-red);
  border-radius:0;
  transition:background-color 120ms cubic-bezier(0.22,1,0.36,1),
             border-color 120ms cubic-bezier(0.22,1,0.36,1),
             color 120ms cubic-bezier(0.22,1,0.36,1),
             transform 100ms cubic-bezier(0.22,1,0.36,1);
}
.hkscta .hkscta__button:link,
.hkscta .hkscta__button:visited{
  color:var(--hkscta-white);
  text-decoration:none;
}
.hkscta .hkscta__button:hover{
  background:var(--hkscta-dark-red);
  border-color:var(--hkscta-dark-red);
  color:var(--hkscta-white);
  text-decoration:none;
}
.hkscta .hkscta__button:active{transform:scale(0.98);}
.hkscta .hkscta__button:focus-visible{
  outline:2px solid var(--hkscta-red);
  outline-offset:2px;
}
/* ---- Secondary (outline) button ---- */
.hkscta .hkscta__button--secondary{
  background:transparent;
  border-color:var(--hkscta-white);
  color:var(--hkscta-white);
}
.hkscta .hkscta__button--secondary:link,
.hkscta .hkscta__button--secondary:visited{
  color:var(--hkscta-white);
}
.hkscta .hkscta__button--secondary:hover{
  background:var(--hkscta-white);
  border-color:var(--hkscta-white);
  color:var(--hkscta-black);
}
/* ---- Light variant ---- */
.hkscta.hkscta--light{
  background:var(--hkscta-white);
  color:var(--hkscta-black);
  border-top-color:var(--hkscta-black);
}
.hkscta.hkscta--light .hkscta__heading{color:var(--hkscta-black);}
.hkscta.hkscta--light .hkscta__body{color:#373737;}
.hkscta.hkscta--light .hkscta__button--secondary,
.hkscta.hkscta--light .hkscta__button--secondary:link,
.hkscta.hkscta--light .hkscta__button--secondary:visited{
  border-color:var(--hkscta-black);
  color:var(--hkscta-black);
}
.hkscta.hkscta--light .hkscta__button--secondary:hover{
  background:var(--hkscta-black);
  border-color:var(--hkscta-black);
  color:var(--hkscta-white);
}
.hkscta.hkscta--light .hkscta__button:focus-visible{
  outline-color:var(--hkscta-black);
}
@media (max-width:600px){
  .hkscta{padding:36px 20px;}
  .hkscta .hkscta__buttons{gap:12px;}
  .hkscta .hkscta__button{
    display:block;
    width:100%;
    padding:18px 20px;
    font-size:17px;
  }
}
@media (prefers-reduced-motion:reduce){
  .hkscta .hkscta__button{transition:none;}
  .hkscta .hkscta__button:active{transform:none;}
}
</style>
<section class="hkscta">
  <div class="hkscta__inner">
    <p class="hkscta__overline">Girls in the Game</p>
    <h2 class="hkscta__heading">Get her on the court</h2>
    <p class="hkscta__body">
      Tuesday 6th October, 1.30pm at Illawarra Sports Stadium in Berkeley.
      Two hours of basketball and teamwork with our crew, for girls aged 5 to 12.
    </p>
    <div class="hkscta__buttons">
      <a class="hkscta__button"
         href="https://www.eventbrite.com.au/e/illawarra-hawks-girls-in-the-game-tickets-1995414633885"
         target="_blank"
         rel="noopener noreferrer">
        Register now
      </a>
      <a class="hkscta__button hkscta__button--secondary"
         href="https://mailchi.mp/hawks/illawarra-hawks-newsletter"
         target="_blank"
         rel="noopener noreferrer">
        Join the mailing list
      </a>
    </div>
  </div>
</section>
